name: Build Komikta APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: komikta-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Komikta Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools" "$RUNNER_TEMP/android-cli"
          cd "$RUNNER_TEMP/android-cli"

          curl -fL --retry 3 \
            -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q tools.zip
          rm -rf "$SDK/cmdline-tools/latest"
          mv cmdline-tools "$SDK/cmdline-tools/latest"

          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses
          result=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$result" -ne 0 ]; then
            exit "$result"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK tidak ditemukan atau kosong"
            exit 1
          fi

          ls -lh "$APK"
          echo "APK berhasil dibuat"

      - name: Upload Komikta APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikta-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
